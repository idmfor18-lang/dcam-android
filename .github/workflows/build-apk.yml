name: Build D-CAM Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dcam-release.jks"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/dcam-release.jks" \
              -alias dcam -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass dcamrelease123 -keypass dcamrelease123 \
              -dname "CN=D-CAM,O=DCAM,C=UA"
          fi

      - name: Build signed Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/dcam-release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'dcamrelease123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dcam' }}
          KEY_PASS: ${{ secrets.KEY_PASS || 'dcamrelease123' }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare D-CAM.apk
        run: |
          cp app/build/outputs/apk/release/app-release.apk D-CAM.apk
          ls -lh D-CAM.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 D-CAM.apk --clobber
          else
            gh release create v1.0.0 D-CAM.apk \
              --title "D-CAM Android v1.0.0" \
              --notes "Клиент для камеры D-CAM (camdm.pp.ua)." \
              --latest
          fi
